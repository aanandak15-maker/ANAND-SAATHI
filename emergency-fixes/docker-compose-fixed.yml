# Fixed Docker Compose for Anand Saathi
# Removed deprecated version field
services:
  timesfm-api:
    build:
      context: ./timesfm-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"  # Fixed port mapping
    environment:
      - PYTHONPATH=/app
      - MODEL_CACHE_DIR=/app/models
      - PYTHONUNBUFFERED=1
    volumes:
      - timesfm-models:/app/models  # Only mount models, not entire directory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]  # Fixed port
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - anand-saathi-network

  anand-saathi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_TIMESFM_API_URL=http://timesfm-api:8001  # Fixed port
      - VITE_OPENWEATHER_API_KEY=623822e31715b644264f0f606c4a9952
      - VITE_GOOGLE_MAPS_API_KEY=AIzaSyBZlJtstGEj9wCMP5_O5PaGytIi-iForN0
    depends_on:
      timesfm-api:
        condition: service_healthy  # Wait for health check
    restart: unless-stopped
    networks:
      - anand-saathi-network

  # Add Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - anand-saathi-network

volumes:
  timesfm-models:
  redis-data:

networks:
  anand-saathi-network:
    driver: bridge
